<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>돌돌 — 커뮤니티 숏폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --ink:#17181C; --paper:#F2F0EC;
  --dim:#9A9CA4; --dimmer:#6C6E76;
  --like:#F0576E; --save:#E8A33D;
  --line:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--paper);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:16px;line-height:1.5;letter-spacing:-0.01em;
  touch-action:pan-y;
}

/* 상단 */
.top{
  position:fixed;top:0;left:0;right:0;z-index:30;
  padding:max(10px,env(safe-area-inset-top)) 0 14px;
  background:linear-gradient(to bottom,rgba(23,24,28,.92),rgba(23,24,28,0));
  transition:opacity .22s, transform .22s;
}
.top{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:18px;padding:0 18px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;flex:1}
.tabs::-webkit-scrollbar{display:none}
.fsbtn{flex:0 0 auto;background:none;border:0;color:var(--dim);padding:0 16px 0 0;cursor:pointer}
.fsbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.fsbtn.on{color:var(--paper)}
.tab{flex:0 0 auto;background:none;border:0;padding:2px 0;
  font-family:inherit;font-size:15px;color:var(--dim);position:relative;cursor:pointer;
  transition:color .18s}
.tab[aria-selected="true"]{color:var(--paper);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  bottom:-6px;width:16px;height:2px;background:var(--paper);border-radius:2px}

/* 진행 막대 */
.prog{position:fixed;top:0;left:0;height:2px;z-index:40;background:var(--paper);
  width:0;transition:width .25s ease-out;opacity:.85}

/* 피드 */
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;overscroll-behavior-y:contain}
.feed::-webkit-scrollbar{display:none}
.slide{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 0 calc(78px + env(safe-area-inset-bottom))}

.media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(64px,22vw,110px);transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.media::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(23,24,28,.55) 0%,rgba(23,24,28,0) 26%,rgba(23,24,28,0) 44%,rgba(23,24,28,.9) 88%)}
.ph{font-size:12px;color:rgba(255,255,255,.45);position:absolute;bottom:38%}

.body{position:relative;z-index:5;padding:0 74px 0 18px;transition:opacity .22s}
.src{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.srcname{font-size:13px;font-weight:600}
.time{font-size:13px;color:var(--dim)}
.also{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:2px 7px;border-radius:20px}
.title{font-size:19px;font-weight:600;line-height:1.38;margin-bottom:8px}
.summary{font-size:14.5px;line-height:1.62;color:#D9D7D2;max-height:7.2em;overflow:hidden}
.summary.open{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tagline{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;margin-bottom:10px}
.t-ai{background:rgba(255,255,255,.12);color:#CFCCC6}
.t-deal{background:var(--save);color:#2A1D06}
.more{margin-top:10px;background:none;border:1px solid var(--line);color:var(--paper);
  font-family:inherit;font-size:13.5px;padding:9px 0;width:100%;border-radius:9px;cursor:pointer}
.more:active{background:rgba(255,255,255,.07)}

.rail{position:absolute;right:10px;bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:6;display:flex;flex-direction:column;gap:20px;align-items:center;transition:opacity .22s}
.act{background:none;border:0;color:var(--paper);font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.act svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));
  transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.act span{font-size:11.5px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.act.on{color:var(--like)}
.act.on svg{fill:currentColor;stroke:currentColor;transform:scale(1.15)}
.act.saved{color:var(--save)}
.act.saved svg{fill:currentColor;transform:scale(1.12)}

.pop{position:absolute;z-index:20;pointer-events:none;font-size:88px;opacity:0;
  transform:translate(-50%,-50%) scale(.4)}
.pop.go{animation:pop .7s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes pop{
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(-9deg)}
  100%{opacity:0;transform:translate(-50%,-120%) scale(.95) rotate(-9deg)}}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 0 calc(8px + env(safe-area-inset-bottom));
  background:rgba(23,24,28,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(12px);transition:opacity .22s, transform .22s}
.nb{background:none;border:0;color:var(--dimmer);font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;cursor:pointer}
.nb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.nb.cur{color:var(--paper)}

/* 몰입 모드 */
body.zen .top{opacity:0;transform:translateY(-14px);pointer-events:none}
body.zen .nav{opacity:0;transform:translateY(14px);pointer-events:none}
body.zen .body,body.zen .rail{opacity:0;pointer-events:none}
body.zen .media::after{opacity:.25}

.hint{position:fixed;left:50%;bottom:26%;transform:translateX(-50%);z-index:25;
  text-align:center;font-size:13.5px;line-height:1.8;color:rgba(255,255,255,.72);
  animation:float 1.9s ease-in-out infinite;pointer-events:none}
.hint.gone{display:none}
@keyframes float{50%{transform:translate(-50%,-11px)}}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(14px);z-index:45;
  background:rgba(242,240,236,.95);color:var(--ink);
  padding:9px 16px;border-radius:22px;font-size:13.5px;font-weight:500;
  opacity:0;transition:.22s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 카테고리 전환 플래시 */
.flash{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.flash.go{animation:fl .55s ease-out forwards}
@keyframes fl{20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}

/* 소스 선택 시트 */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .22s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--ink-2,#212328);border-radius:16px 16px 0 0;
  max-height:78vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:16px;font-weight:600}
.sheet-all{background:none;border:1px solid var(--line);color:var(--dim);
  font-family:inherit;font-size:12.5px;padding:6px 11px;border-radius:20px;cursor:pointer}
.sheet-close{background:none;border:0;color:var(--dim);padding:4px;cursor:pointer}
.sheet-close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.sheet-list{overflow-y:auto;padding:6px 18px 18px;-webkit-overflow-scrolling:touch}
.src-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.src-row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.src-row .name{flex:1;font-size:14.5px}
.switch{position:relative;width:42px;height:25px;flex:0 0 auto;background:rgba(255,255,255,.14);
  border-radius:20px;border:0;cursor:pointer;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;
  border-radius:50%;background:var(--paper);transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.switch.on{background:var(--save)}
.switch.on::after{transform:translateX(17px)}
.sheet-note{padding:0 18px 6px;font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>

const CATS=["추천","실시간","유머","이슈","움짤"];
let cur="추천", list=[], liked={}, saved={};
const feed=document.getElementById("feed"), hint=document.getElementById("hint"),
      toastEl=document.getElementById("toast"), prog=document.getElementById("prog"),
      flash=document.getElementById("flash"), tabs=document.getElementById("tabs");

const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const num=n=>n>=1000?(n/1000).toFixed(1).replace(".0","")+"k":n;
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");
  clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove("show"),1400)}

CATS.forEach(c=>{
  const b=document.createElement("button");
  b.className="tab";b.textContent=c;b.setAttribute("role","tab");
  b.setAttribute("aria-selected",c===cur);
  b.onclick=()=>switchCat(c,0);
  tabs.appendChild(b);
});

function switchCat(c,dir){
  if(c===cur)return;
  cur=c;buzz(12);
  [...tabs.children].forEach(x=>{
    const on=x.textContent===c;
    x.setAttribute("aria-selected",on);
    if(on)x.scrollIntoView({inline:"center",block:"nearest"});
  });
  flash.textContent=c;flash.classList.remove("go");void flash.offsetWidth;flash.classList.add("go");
  render();feed.scrollTo({top:0});
  updateProg();
}

function slideHTML(p,i){
  const s=SRC[p.src], bg=BG[i%BG.length], key=p.title;
  const media=p.t==="story"
    ? `<div class="media" style="background:${bg}"></div>`
    : `<div class="media" style="background:${bg}">${p.emoji||""}<span class="ph">샘플 이미지 자리</span></div>`;
  let tag="";
  if(p.t==="story")tag=`<span class="tagline t-ai">AI 요약</span>`;
  if(p.t==="link") tag=`<span class="tagline t-deal">핫딜</span>`;
  const sum=p.sum?`<p class="summary">${p.sum}</p>`:"";
  const more=p.t==="story"?`<button class="more" data-act="expand">본문 더 보기</button>`
    :(p.t==="link"?`<button class="more" data-act="open">보러 가기 ↗</button>`:"");
  const also=p.also?`<span class="also">외 ${p.also}곳</span>`:"";
  const lk=liked[key], sv=saved[key];
  return `<section class="slide" data-i="${i}" data-key="${key}">
    ${media}<div class="pop">❤️</div>
    <div class="body">
      <div class="src"><span class="dot" style="background:${s.c}"></span>
        <span class="srcname">${s.n}</span><span class="time">· ${p.time}</span>${also}</div>
      ${tag}<h2 class="title">${p.title}</h2>${sum}${more}
    </div>
    <div class="rail">
      <button class="act${lk?" on":""}" data-act="like">
        <svg viewBox="0 0 24 24"><path d="M12 20.5S3.5 15 3.5 8.9A4.4 4.4 0 0 1 12 6.8a4.4 4.4 0 0 1 8.5 2.1c0 6.1-8.5 11.6-8.5 11.6z"/></svg>
        <span>${num(p.likes+(lk?1:0))}</span></button>
      <button class="act" data-act="cmt">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-5A8 8 0 1 1 21 12z"/></svg>
        <span>${num(p.cmt)}</span></button>
      <button class="act${sv?" saved":""}" data-act="save">
        <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        <span>저장</span></button>
      <button class="act" data-act="share">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4M8.6 13.4l6.8 4"/></svg>
        <span>공유</span></button>
    </div></section>`;
}

const enabledSrc={};
SRC_ORDER.forEach(k=>enabledSrc[k]=true);

function render(){
  list=POSTS.filter(p=>p.cat.includes(cur)&&enabledSrc[p.src]);
  feed.innerHTML=list.length
    ? list.map(slideHTML).join("")
    : `<section class="slide"><div class="body" style="padding-right:18px">
         <p class="title" style="text-align:center">켜둔 소스에 해당 글이 없어요</p>
         <p class="summary" style="text-align:center;max-height:none">MY 탭에서 소스를 더 켜보세요.</p>
       </div></section>`;
}
function updateProg(){
  const i=Math.round(feed.scrollTop/window.innerHeight)+1;
  prog.style.width=(i/Math.max(list.length,1)*100)+"%";
}
render();updateProg();

/* 소스 선택 시트 */
const backdrop=document.getElementById("backdrop"), sheet=document.getElementById("sheet"),
      srcList=document.getElementById("srcList"), allBtn=document.getElementById("allBtn");

function paintAllBtn(){
  const n=SRC_ORDER.filter(k=>enabledSrc[k]).length;
  allBtn.textContent = n===SRC_ORDER.length ? "전체 해제" : "전체 선택";
}

SRC_ORDER.forEach(k=>{
  const s=SRC[k];
  const row=document.createElement("div");
  row.className="src-row";
  row.innerHTML=`<span class="dot" style="background:${s.c}"></span>
    <span class="name">${s.n}</span>
    <button class="switch on" data-src="${k}" aria-label="${s.n} 켜짐"></button>`;
  srcList.appendChild(row);
});
paintAllBtn();

srcList.addEventListener("click",e=>{
  const b=e.target.closest(".switch");if(!b)return;
  const k=b.dataset.src, on=!enabledSrc[k];
  enabledSrc[k]=on;
  b.classList.toggle("on",on);
  b.setAttribute("aria-label",`${SRC[k].n} ${on?"켜짐":"꺼짐"}`);
  buzz(8);paintAllBtn();
  render();feed.scrollTo({top:0});
});

allBtn.onclick=()=>{
  const turnOn = allBtn.textContent==="전체 선택";
  SRC_ORDER.forEach(k=>enabledSrc[k]=turnOn);
  [...srcList.querySelectorAll(".switch")].forEach(b=>{
    b.classList.toggle("on",turnOn);
    b.setAttribute("aria-label",`${SRC[b.dataset.src].n} ${turnOn?"켜짐":"꺼짐"}`);
  });
  paintAllBtn();render();feed.scrollTo({top:0});
};

function openSheet(){backdrop.classList.add("open");sheet.classList.add("open")}
function closeSheet(){backdrop.classList.remove("open");sheet.classList.remove("open")}
document.getElementById("myBtn").onclick=openSheet;
document.getElementById("sheetClose").onclick=closeSheet;
backdrop.onclick=closeSheet;

/* 액션 */
feed.addEventListener("click",e=>{
  const btn=e.target.closest("[data-act]");if(!btn)return;
  const act=btn.dataset.act, slide=btn.closest(".slide"), key=slide.dataset.key;
  const post=POSTS.find(p=>p.title===key);
  if(act==="like"){
    const on=!liked[key];liked[key]=on;buzz(on?18:8);
    btn.classList.toggle("on",on);
    btn.querySelector("span").textContent=num(post.likes+(on?1:0));
  }
  else if(act==="save"){
    const on=!saved[key];saved[key]=on;buzz(12);
    btn.classList.toggle("saved",on);
    toast(on?"저장함에 담았어요":"저장을 취소했어요");
  }
  else if(act==="share")toast("공유 시트 (프로토타입)");
  else if(act==="cmt")toast("댓글은 다음 단계에서");
  else if(act==="open")toast("원문 사이트로 이동 (프로토타입)");
  else if(act==="expand"){
    const s=slide.querySelector(".summary");
    const o=s.classList.toggle("open");
    btn.textContent=o?"접기":"본문 더 보기";
  }
});

/* 제스처: 더블탭 / 롱프레스 / 좌우 스와이프 */
let sx=0,sy=0,st=0,lastTap=0,lp=null,moved=false;

feed.addEventListener("pointerdown",e=>{
  if(e.target.closest("[data-act]"))return;
  sx=e.clientX;sy=e.clientY;st=Date.now();moved=false;
  lp=setTimeout(()=>{if(!moved){document.body.classList.add("zen");buzz(20)}},380);
},{passive:true});

feed.addEventListener("pointermove",e=>{
  if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){moved=true;clearTimeout(lp)}
},{passive:true});

feed.addEventListener("pointerup",e=>{
  clearTimeout(lp);
  if(document.body.classList.contains("zen")){document.body.classList.remove("zen");return}
  if(e.target.closest("[data-act]"))return;

  const dx=e.clientX-sx, dy=e.clientY-sy, dt=Date.now()-st;
  /* 좌우 스와이프 → 카테고리 전환 */
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6&&dt<600){
    const i=CATS.indexOf(cur), ni=dx<0?i+1:i-1;
    if(ni>=0&&ni<CATS.length)switchCat(CATS[ni],dx<0?1:-1);
    else{buzz(6);toast(dx<0?"마지막 카테고리예요":"첫 카테고리예요")}
    return;
  }
  if(moved)return;

  /* 더블탭 좋아요 */
  const now=Date.now();
  if(now-lastTap<300){
    const slide=e.target.closest(".slide");if(!slide)return;
    const key=slide.dataset.key, post=POSTS.find(p=>p.title===key);
    const pop=slide.querySelector(".pop"), r=slide.getBoundingClientRect();
    pop.style.left=(e.clientX-r.left)+"px";pop.style.top=(e.clientY-r.top)+"px";
    pop.classList.remove("go");void pop.offsetWidth;pop.classList.add("go");
    buzz(18);
    if(!liked[key]){
      liked[key]=true;
      const like=slide.querySelector('[data-act="like"]');
      like.classList.add("on");
      like.querySelector("span").textContent=num(post.likes+1);
    }
    lastTap=0;
  }else lastTap=now;
});

/* 전체화면: 주소창 등 브라우저 UI 숨기기 */
const fsbtn=document.getElementById("fsbtn");
const canFS=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);

function enterFS(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req)req.call(el).catch(()=>{});
}
function exitFS(){
  const ex=document.exitFullscreen||document.webkitExitFullscreen;
  if(ex)ex.call(document).catch(()=>{});
}
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}

if(!canFS){
  fsbtn.style.display="none";
}else{
  fsbtn.onclick=()=> isFS()?exitFS():enterFS();
  document.addEventListener("fullscreenchange",()=>fsbtn.classList.toggle("on",isFS()));
  document.addEventListener("webkitfullscreenchange",()=>fsbtn.classList.toggle("on",isFS()));
}

/* 스크롤: 진행률, 힌트 제거, 카드 전환 진동, 끝 감지, 전체화면 자동 전환 */
let lastIdx=0;
feed.addEventListener("scroll",()=>{
  if(feed.scrollTop>60)hint.classList.add("gone");
  updateProg();
  const i=Math.round(feed.scrollTop/window.innerHeight);
  if(i!==lastIdx){
    lastIdx=i;buzz(6);
    if(canFS){
      if(i>0&&!isFS())enterFS();
      else if(i===0&&isFS())exitFS();
    }
  }
  if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-4)toast("마지막 글이에요 · 좌우로 밀어 다른 카테고리");
},{passive:true});
</script>
